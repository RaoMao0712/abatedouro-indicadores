{% extends "base.html" %}{% block conteudo %}<section class="hero-dashboard"><div><span class="eyebrow">Compras · Rascunho</span><h2>Editar {{rc.numero}}</h2><p>Origem imutável: {{rc.origem_numero_snapshot}} — {{rc.origem_descricao_snapshot}}</p></div></section><form method="post" class="card"><input type="hidden" name="idempotency_key" value="{{idempotency_key}}"><input type="hidden" name="versao" value="{{rc.versao}}"><div id="rc-itens">{% for i in rc.itens %}<div class="form-grid"><label>Material<select name="material_id"><option value="">Provisório</option>{% for m in insumos %}<option value="{{m.id}}" {% if i.material_id==m.id %}selected{% endif %}>{{m.descricao}}</option>{% endfor %}</select></label><label>Descrição<input name="descricao_item" value="{{i.descricao_snapshot if not i.material_id else ''}}"></label><label>Unidade<select name="unidade_item">{% for u in unidades %}<option {% if i.unidade_snapshot==u %}selected{% endif %}>{{u}}</option>{% endfor %}</select></label><label>Quantidade<input name="quantidade_item" value="{{i.quantidade_solicitada}}"></label><label>Custo<input name="custo_item" value="{{i.custo_estimado_unitario or ''}}"></label><label>Observação<input name="observacao_item" value="{{i.observacao or ''}}"></label></div>{% endfor %}</div><label>Prioridade<select name="prioridade">{% for p in prioridades %}<option {% if rc.prioridade==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label><label>Justificativa<textarea name="justificativa">{{rc.justificativa or ''}}</textarea></label><label>Observações<textarea name="observacoes">{{rc.observacoes or ''}}</textarea></label><button>Salvar alterações</button></form>{% endblock %}
