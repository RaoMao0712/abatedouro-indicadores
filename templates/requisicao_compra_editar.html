{% extends "base.html" %}{% block conteudo %}<section class="hero-dashboard"><div><span class="eyebrow">Compras · Rascunho</span><h2>Editar {{rc.numero}}</h2><p>Origem imutável: {{rc.origem_numero_snapshot}} — {{rc.origem_descricao_snapshot}}</p></div></section><form method="post" class="card"><input type="hidden" name="idempotency_key" value="{{idempotency_key}}"><input type="hidden" name="versao" value="{{rc.versao}}"><div id="rc-itens">{% for i in rc.itens %}<div class="form-grid"><label>Material<select name="material_id"><option value="">Provisório</option>{% for m in insumos %}<option value="{{m.id}}" {% if i.material_id==m.id %}selected{% endif %}>{{m.descricao}}</option>{% endfor %}</select></label><label>Descrição<input name="descricao_item" value="{{i.descricao_snapshot if not i.material_id else ''}}"></label><label>Unidade<select name="unidade_item">{% for u in unidades %}<option {% if i.unidade_snapshot==u %}selected{% endif %}>{{u}}</option>{% endfor %}</select></label><label>Quantidade<input name="quantidade_item" value="{{i.quantidade_solicitada}}"></label><label>Custo unit. estimado<input name="custo_item" value="{{i.custo_unitario_input or ''}}"></label><label>Observação<input name="observacao_item" value="{{i.observacao or ''}}"></label></div>{% endfor %}</div><label>Prioridade<select name="prioridade">{% for p in prioridades %}<option {% if rc.prioridade==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label><label>Justificativa<textarea name="justificativa">{{rc.justificativa or ''}}</textarea></label><label>Observações<textarea name="observacoes">{{rc.observacoes or ''}}</textarea></label><button>Salvar alterações</button></form>
<script>
(()=>{const box=document.getElementById('rc-itens');if(!box)return;const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});const dec=v=>{const m=/^(\d+)(?:\.(\d+))?$/.exec(String(v||'').trim().replace(',','.'));if(!m)return null;const f=m[2]||'';return{n:BigInt(m[1]+f),s:f.length}};const cents=(a,b)=>{const n=a.n*b.n,s=a.s+b.s;if(s<=2)return n*10n**BigInt(2-s);const d=10n**BigInt(s-2);let r=n/d;if((n%d)*2n>=d)r+=1n;return r};const geral=document.createElement('p');geral.id='rc-total-geral';geral.className='obs';box.after(geral);function recalc(){let soma=0n,sem=0;[...box.children].forEach(r=>{let o=r.querySelector('.rc-total-item');if(!o){const l=document.createElement('label');l.innerHTML='Total estimado<output class="rc-total-item">—</output>';const a=r.querySelector('.rc-item-actions');a?r.insertBefore(l,a):r.appendChild(l);o=l.querySelector('output')}const q=dec(r.querySelector('[name=quantidade_item]')?.value),c=dec(r.querySelector('[name=custo_item]')?.value);if(c===null){o.textContent='—';sem++}else if(q!==null){const t=cents(q,c);soma+=t;o.textContent=brl.format(Number(t)/100)}else{o.textContent='—'}});geral.innerHTML=(sem?'Total estimado parcial':'Total estimado')+' (referência; o valor oficial é calculado ao salvar): <strong>'+brl.format(Number(soma)/100)+'</strong>'+(sem?' · '+sem+' de '+box.children.length+' item(ns) sem custo estimado':'')}box.addEventListener('input',recalc);box.addEventListener('click',()=>setTimeout(recalc,0));new MutationObserver(recalc).observe(box,{childList:true});recalc()})();
</script>{% endblock %}
