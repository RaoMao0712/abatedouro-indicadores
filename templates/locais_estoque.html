{% extends "base.html" %}{% block conteudo %}
<div class="expedicao-page"><header class="expedicao-module-header"><div><span class="eyebrow">Cadastros</span><h2>Locais de estoque</h2><p>Locais físicos usados por pallets, estoque, movimentação e etiquetas.</p></div></header>
<section class="card pallet-section"><h3>Novo local</h3><form method="post" class="form-grid"><label>Nome<input name="nome" required></label><label>Descrição<input name="descricao"></label><label>Tipo/classificação<input name="tipo" value="interno" required></label><label>Ativo<select name="ativo"><option>Sim</option><option>Não</option></select></label><button class="romaneio-btn romaneio-btn-primary">Salvar local</button></form></section>
<section class="card pallet-table-card"><div class="tabela-responsiva"><table><thead><tr><th>Nome</th><th>Descrição</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead><tbody>{% for local in locais %}<tr><form method="post"><input type="hidden" name="local_id" value="{{ local.id }}"><td><input name="nome" value="{{ local.nome }}" required></td><td><input name="descricao" value="{{ local.descricao or '' }}"></td><td><input name="tipo" value="{{ local.tipo or 'interno' }}"></td><td><select name="ativo"><option{% if local.ativo=='Sim' %} selected{% endif %}>Sim</option><option{% if local.ativo!='Sim' %} selected{% endif %}>Não</option></select></td><td><button class="romaneio-btn romaneio-btn-secondary">Salvar</button></form><form method="post" action="{{ url_for('alternar_local_estoque_cadastro',local_id=local.id) }}"><button class="romaneio-btn romaneio-btn-neutral">{{ 'Inativar' if local.ativo=='Sim' else 'Ativar' }}</button></form></td></tr>{% else %}<tr><td colspan="5">Nenhum local cadastrado.</td></tr>{% endfor %}</tbody></table></div></section></div>
{% endblock %}
