{% extends "base.html" %}

{% block conteudo %}
<div class="fd-login-shell">
    <header class="fd-login-topbar">
        <a class="fd-login-brand" href="{{ url_for('login') }}" aria-label="FrigoDatta — São Pedro Galinha Regional">
            <img src="{{ url_for('static', filename='imagens/logo.png') }}" alt="São Pedro Galinha Regional">
            <span class="fd-login-brand-divider" aria-hidden="true"></span>
            <span class="fd-login-wordmark">FRIGO<strong>DATTA</strong></span>
        </a>

        <form class="fd-login-form" method="POST" aria-label="Acesso ao FrigoDatta">
            <div class="fd-login-field">
                <label for="login-email">E-mail</label>
                <div class="fd-login-input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6.75A1.75 1.75 0 0 1 4.75 5h14.5A1.75 1.75 0 0 1 21 6.75v10.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 1.75 0 0 1 3 17.25V6.75Zm1.8-.25L12 12.1l7.2-5.6H4.8Zm14.7 1.9-7.04 5.48a.75.75 0 0 1-.92 0L4.5 8.4v8.85c0 .14.11.25.25.25h14.5a.25.25 0 0 0 .25-.25V8.4Z"/></svg>
                    <input id="login-email" type="email" name="email" autocomplete="username" inputmode="email" required>
                </div>
            </div>
            <div class="fd-login-field">
                <label for="login-senha">Senha</label>
                <div class="fd-login-input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10h.75A1.75 1.75 0 0 1 19 11.75v7.5A1.75 1.75 0 0 1 17.25 21H6.75A1.75 1.75 0 0 1 5 19.25v-7.5A1.75 1.75 0 0 1 6.75 10h.75Zm1.5 0h6V7.5a3 3 0 0 0-6 0V10Zm-2.25 1.5a.25.25 0 0 0-.25.25v7.5c0 .14.11.25.25.25h10.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25H6.75Z"/></svg>
                    <input id="login-senha" type="password" name="senha" autocomplete="current-password" required>
                    <button class="fd-password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5c5.2 0 8.75 4.4 9.72 5.76a2.1 2.1 0 0 1 0 2.48C20.75 14.6 17.2 19 12 19s-8.75-4.4-9.72-5.76a2.1 2.1 0 0 1 0-2.48C3.25 9.4 6.8 5 12 5Zm0 1.5c-4.43 0-7.57 3.84-8.5 5.13a.62.62 0 0 0 0 .74c.93 1.29 4.07 5.13 8.5 5.13s7.57-3.84 8.5-5.13a.62.62 0 0 0 0-.74C19.57 10.34 16.43 6.5 12 6.5Zm0 2.25A3.25 3.25 0 1 1 12 15.25 3.25 3.25 0 0 1 12 8.75Zm0 1.5A1.75 1.75 0 1 0 12 13.75 1.75 1.75 0 0 0 12 10.25Z"/></svg>
                    </button>
                </div>
            </div>
            <button class="fd-login-submit" type="submit">Entrar</button>
        </form>
    </header>

    <main class="fd-login-hero">
        <section class="fd-login-copy" aria-labelledby="fd-login-title">
            <h1 id="fd-login-title"><span>Gestão integrada da</span><strong>operação avícola.</strong></h1>
            <span class="fd-login-accent" aria-hidden="true"></span>
            <p>Controle da produção, estoque, rastreabilidade<br>e expedição com segurança e eficiência.</p>
        </section>
        <img class="fd-login-art" src="{{ url_for('static', filename='imagens/login-hero-industrial.png') }}" alt="Ilustração de uma linha industrial avícola com esteira e caixas">
        <div class="fd-login-curves" aria-hidden="true"><span></span><span></span></div>
    </main>

    <footer class="fd-login-footer">Frigo Datta <span aria-hidden="true">|</span> São Pedro Galinha Regional</footer>
</div>
<script src="{{ url_for('static', filename='login.js', v='login-exat7-20261104') }}" defer></script>
{% endblock %}
