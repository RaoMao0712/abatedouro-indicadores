{% extends "base.html" %}

{% block conteudo %}

<div class="card">
    <h2>Editar Mão de Obra</h2>
    <p class="obs">
        Ajuste o colaborador, função ou setor do apontamento. Esta edição só fica liberada enquanto a OP estiver aberta, exceto para administrador.
    </p>
</div>

<div class="card ficha">
    <form method="POST">
        <div class="form-grid">

            <div>
                <label>Data</label>
                <input type="date" value="{{ apontamento.data }}" disabled>
            </div>

            <div>
                <label>OP</label>
                <input type="text" value="OP {{ apontamento.op_id }}" disabled>
            </div>

            <div>
                <label>Parceiro</label>
                <select name="parceiro_id" required>
                    {% if not apontamento.parceiro_id %}<option value="" selected>Legado: {{ apontamento.colaborador }} — selecione um parceiro</option>{% endif %}
                    {% for parceiro in parceiros_elegiveis %}<option value="{{ parceiro.id }}" {% if apontamento.parceiro_id==parceiro.id %}selected{% endif %}>{{ parceiro.razao_social }}</option>{% endfor %}
                    {% if apontamento.parceiro_id and apontamento.parceiro_id not in parceiros_elegiveis_ids %}<option value="{{ apontamento.parceiro_id }}" selected>{{ apontamento.parceiro_nome_snapshot or apontamento.colaborador }} — vínculo histórico</option>{% endif %}
                </select>
            </div>

            <div>
                <label>Natureza do vínculo</label>
                <select name="natureza_vinculo" required>
                    <option value="COLABORADOR_CLT" {% if apontamento.natureza_vinculo=='COLABORADOR_CLT' %}selected{% endif %}>Colaborador CLT</option>
                    <option value="PRESTADOR_SERVICOS" {% if apontamento.natureza_vinculo=='PRESTADOR_SERVICOS' %}selected{% endif %}>Prestador de Serviços</option>
                </select>
                <small>O snapshot só muda se outro parceiro for escolhido.</small>
            </div>

            <div>
                <label>Função</label>
                <select name="funcao" required>
                    {% for funcao in lista_funcoes %}
                    <option
                        value="{{ funcao }}"
                        {% if apontamento.funcao == funcao %}selected{% endif %}
                    >
                        {{ funcao }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Setor</label>
                <select name="setor" required>
                    {% for setor in setores %}
                    <option
                        value="{{ setor }}"
                        {% if apontamento.setor == setor %}selected{% endif %}
                    >
                        {{ setor }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label>Turno</label>
                <input
                    type="text"
                    name="turno"
                    value="{{ apontamento.turno or '' }}"
                >
            </div>

            <div>
                <label>Observações</label>
                <input
                    type="text"
                    name="observacoes"
                    value="{{ apontamento.observacoes or '' }}"
                >
            </div>

        </div>

        <button type="submit">Salvar Alterações</button>

        <a
            href="{{ url_for('consultar_op', op_id=apontamento.op_id) }}"
            class="botao-impressao"
        >
            Voltar para OP
        </a>
    </form>
</div>

{% endblock %}
