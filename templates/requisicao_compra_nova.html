{% extends "base.html" %}{% block conteudo %}<section class="hero-dashboard"><div><span class="eyebrow">Compras</span><h2>Nova Requisição de Compra</h2><p>A RC não movimenta estoque nem Financeiro.</p></div></section>
<form method="post" class="card"><input type="hidden" name="idempotency_key" value="{{idempotency_key}}"><h3>1. Origem</h3><div class="form-grid"><label>Tipo<select name="tipo_origem" required>{% for x in tipos_origem %}<option value="{{x}}" {% if pre_tipo==x %}selected{% endif %}>{{x|replace('_',' ')}}</option>{% endfor %}</select></label><label>ID do documento<input type="number" name="origem_id" value="{{pre_id}}"></label><label>Número/código manual<input name="origem_numero" value="{{pre_numero}}"></label><label>Setor<input name="setor" required value="{{pre_setor}}"></label><label class="form-span-2">Descrição da necessidade<input name="origem_descricao" value="{{pre_descricao}}"></label></div><h3>2. Itens</h3><div id="rc-itens"><div class="form-grid"><label>Material cadastrado<select name="material_id"><option value="">Item provisório</option>{% for i in insumos %}<option value="{{i.id}}">{{i.descricao}} — {{i.unidade}}</option>{% endfor %}</select></label><label>Descrição provisória<input name="descricao_item"></label><label>Unidade<select name="unidade_item"><option value=""></option>{% for u in unidades %}<option>{{u}}</option>{% endfor %}</select></label><label>Quantidade<input name="quantidade_item" required></label><label>Custo unitário estimado<input name="custo_item"></label><label>Observação<input name="observacao_item"></label></div></div><button type="button" onclick="document.getElementById('rc-itens').appendChild(document.getElementById('rc-itens').firstElementChild.cloneNode(true))">+ Item</button><h3>3. Contexto</h3><div class="form-grid"><label>Prioridade<select name="prioridade">{% for x in prioridades %}<option>{{x}}</option>{% endfor %}</select></label><label>Responsável<input name="responsavel_nome"></label><label class="form-span-2">Justificativa<textarea name="justificativa"></textarea></label><label class="form-span-2">Observações<textarea name="observacoes"></textarea></label></div><button class="botao-principal">Salvar rascunho</button></form>{% endblock %}
