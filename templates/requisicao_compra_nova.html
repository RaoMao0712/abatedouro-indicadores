{% extends "base.html" %}
{% block conteudo %}
<section class="hero-dashboard rc-hero"><div><span class="eyebrow">Compras</span><h2>Nova Requisição de Compra</h2><p>Registre a necessidade sem movimentar estoque ou Financeiro.</p></div></section>
<form method="post" class="card rc-form" id="rc-form">
  <input type="hidden" name="idempotency_key" value="{{idempotency_key}}">
  <h3>1. Origem da necessidade</h3>
  <div class="form-grid rc-origin-grid">
    <label>Tipo de origem<select name="tipo_origem" id="rc-tipo" required>{% for x in tipos_origem %}<option value="{{x}}" {% if pre_tipo==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label>
    <label class="rc-formal" data-tipos="REPOSICAO_ESTOQUE">Material que originou a reposição<select name="origem_reposicao" class="rc-origem-select"><option value="">Selecione o material</option>{% for x in origens.materiais %}<option value="{{x.id}}" data-unidade="{{x.unidade}}" {% if pre_tipo=='REPOSICAO_ESTOQUE' and pre_id|string==x.id|string %}selected{% endif %}>{{x.descricao}} — {{x.unidade}}</option>{% endfor %}</select></label>
    <label class="rc-formal" data-tipos="ORDEM_SERVICO">Selecionar Ordem de Serviço<select name="origem_os" class="rc-origem-select"><option value="">Busque por número ou descrição</option>{% for x in origens.ordens_servico %}<option value="{{x.id}}" {% if pre_tipo=='ORDEM_SERVICO' and pre_id|string==x.id|string %}selected{% endif %}>OS-{{'%06d'|format(x.id)}} — {{x.descricao}} · {{x.status}}</option>{% endfor %}</select></label>
    <label class="rc-formal" data-tipos="ORDEM_PRODUCAO">Selecionar Ordem de Produção<select name="origem_op" class="rc-origem-select"><option value="">Busque por OP ou produto</option>{% for x in origens.ordens_producao %}<option value="{{x.id}}" {% if pre_tipo=='ORDEM_PRODUCAO' and pre_id|string==x.id|string %}selected{% endif %}>OP-{{'%06d'|format(x.id)}} — {{x.sku or 'Produto não informado'}} · {{x.status}}</option>{% endfor %}</select></label>
    <label class="rc-formal" data-tipos="NAO_CONFORMIDADE_SGI">Selecionar Não Conformidade<select name="origem_nc" class="rc-origem-select"><option value="">Selecione a não conformidade</option>{% for x in origens.nao_conformidades %}<option value="{{x.id}}" {% if pre_tipo=='NAO_CONFORMIDADE_SGI' and pre_id|string==x.id|string %}selected{% endif %}>NC-{{'%06d'|format(x.id)}} — {{x.descricao}} · {{x.criticidade}}</option>{% endfor %}</select></label>
    <input type="hidden" name="origem_id" id="rc-origem-id" value="{{pre_id}}">
    <label class="rc-manual rc-projeto">Código ou nome do projeto<input name="origem_numero" value="{{pre_numero}}"></label>
    <label class="rc-manual">Setor<input name="setor" value="{{pre_setor}}"></label>
    <label class="rc-manual form-span-2">Descrição da necessidade<input name="origem_descricao" value="{{pre_descricao}}"></label>
  </div>
  <h3>2. Itens</h3>
  <div id="rc-itens"><div class="rc-item form-grid">
    <label>Tipo do item<select class="rc-item-tipo"><option value="cadastrado">Material cadastrado</option><option value="provisorio">Item não cadastrado</option></select></label>
    <label class="rc-item-cadastrado">Material<select name="material_id" class="rc-material"><option value="">Selecione</option>{% for i in insumos %}<option value="{{i.id}}">{{i.descricao}} — {{i.unidade}}</option>{% endfor %}</select></label>
    <label class="rc-item-provisorio">Descrição<input name="descricao_item"></label>
    <label class="rc-item-provisorio">Unidade<select name="unidade_item"><option value=""></option>{% for u in unidades %}<option>{{u}}</option>{% endfor %}</select></label>
    <label>Quantidade<input name="quantidade_item" inputmode="decimal" required></label><label>Custo unitário estimado<input name="custo_item" inputmode="decimal"></label><label>Observação<input name="observacao_item"></label>
    <div class="rc-item-actions"><button type="button" class="rc-remover botao-link">Remover item</button></div>
  </div></div>
  <button type="button" class="botao-link rc-add-item" id="rc-add-item">+ Adicionar item</button>
  <h3>3. Contexto</h3><div class="form-grid"><label>Prioridade<select name="prioridade">{% for x in prioridades %}<option>{{x}}</option>{% endfor %}</select></label><label>Responsável<input name="responsavel_nome"></label><label class="form-span-2">Justificativa<textarea name="justificativa"></textarea></label><label class="form-span-2">Observações<textarea name="observacoes"></textarea></label></div>
  <div class="rc-actions rc-form-actions"><button class="botao-principal">Salvar rascunho</button><a class="botao-link" href="{{url_for('requisicoes_compra')}}">Voltar</a></div>
</form>
<script>
(()=>{const tipo=document.getElementById('rc-tipo'),origem=document.getElementById('rc-origem-id'),itens=document.getElementById('rc-itens');function item(b){const p=b.querySelector('.rc-item-tipo').value==='provisorio',material=b.querySelector('.rc-material'),descricao=b.querySelector('[name=descricao_item]'),unidade=b.querySelector('[name=unidade_item]');b.querySelectorAll('.rc-item-cadastrado').forEach(x=>x.hidden=p);b.querySelectorAll('.rc-item-provisorio').forEach(x=>x.hidden=!p);material.required=!p;descricao.required=p;unidade.required=p;if(p)material.value='';}function origemUI(){const t=tipo.value,manual=['QUALIDADE','ADMINISTRATIVO','PROJETO','OUTRO'].includes(t);document.querySelectorAll('.rc-formal').forEach(x=>{x.hidden=x.dataset.tipos!==t;x.querySelector('select').required=!x.hidden;});document.querySelectorAll('.rc-manual').forEach(x=>x.hidden=!manual);document.querySelectorAll('.rc-manual input').forEach(x=>x.required=manual);document.querySelector('.rc-projeto').hidden=t!=='PROJETO';document.querySelector('.rc-projeto input').required=t==='PROJETO';const s=document.querySelector(`.rc-formal[data-tipos="${t}"] select`);origem.value=s?s.value:'';if(t==='REPOSICAO_ESTOQUE'&&s&&s.value){const m=itens.querySelector('.rc-material');m.value=s.value;m.closest('.rc-item').querySelector('.rc-item-tipo').value='cadastrado';item(m.closest('.rc-item'));}}document.querySelectorAll('.rc-origem-select').forEach(x=>x.addEventListener('change',origemUI));tipo.addEventListener('change',origemUI);itens.addEventListener('change',e=>{if(e.target.classList.contains('rc-item-tipo'))item(e.target.closest('.rc-item'));});itens.addEventListener('click',e=>{if(e.target.classList.contains('rc-remover')&&itens.children.length>1)e.target.closest('.rc-item').remove();});document.getElementById('rc-add-item').addEventListener('click',()=>{if(tipo.value==='REPOSICAO_ESTOQUE')return;const n=itens.firstElementChild.cloneNode(true);n.querySelectorAll('input').forEach(x=>x.value='');n.querySelectorAll('select').forEach(x=>x.selectedIndex=0);itens.appendChild(n);item(n);});origemUI();document.querySelectorAll('.rc-item').forEach(item);})();
</script>
{% endblock %}
